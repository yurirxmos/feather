name: Release macOS

# Every published release reaches installed apps through Sparkle, so release only from a version
# tag: `git tag v0.1.7 && git push origin v0.1.7`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.ref_name }}
  # Public half of the EdDSA key that signs updates; the private half is the
  # SPARKLE_PRIVATE_ED_KEY secret.
  SPARKLE_PUBLIC_ED_KEY: dTvHI52c2/Ykj+t9pMxH4pjOchlhLj093RGRXbwCU6c=
  CODESIGN_IDENTITY: "Developer ID Application: Yuri Ramos da Silva (YH99T2BXD9)"

jobs:
  build:
    name: Build (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      # SwiftUI lays some views out by the SDK the app links against: the macOS 15 SDK wraps
      # Settings footers into a narrow column. Build with the newest Xcode 26 on the runner.
      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          test -n "$xcode"
          sudo xcode-select -s "$xcode"
          xcrun --show-sdk-version

      - name: Run tests
        run: swift test

      - name: Import signing certificate
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          # The Developer ID certificate never changes: macOS ties the Accessibility and Screen
          # Recording grants to it, so they survive updates. Every release must use it.
          test -n "$DEVELOPER_ID_CERTIFICATE_BASE64"
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          curl -sfo "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          # codesign only finds identities in keychains on the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/release.p12"

      - name: Build app bundle
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          BUILD_NUMBER: ${{ github.run_number }}
          # Each architecture has its own feed: generate_appcast refuses two archives that share
          # one bundle version.
          SPARKLE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast-${{ matrix.architecture }}.xml
        run: |
          VERSION="${VERSION#v}" scripts/bundle.sh
          codesign -dvv dist/Feather.app 2>&1 | grep -q "TeamIdentifier=YH99T2BXD9"
          codesign -dvv dist/Feather.app 2>&1 | grep -q "flags=.*runtime"
          lipo -archs dist/Feather.app/Contents/MacOS/Feather | grep -qx "${{ matrix.architecture }}"
          vtool -show-build dist/Feather.app/Contents/MacOS/Feather | grep -Eq "sdk 2[6-9]"

      - name: Write notarization key
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
        run: |
          test -n "$NOTARY_API_KEY"
          printf '%s' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary.p8"

      - name: Notarize app
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          # Stapled to the app itself, so Gatekeeper accepts it offline and after Sparkle installs it.
          ditto -c -k --keepParent dist/Feather.app "$RUNNER_TEMP/Feather.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Feather.zip" --wait \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID"
          xcrun stapler staple dist/Feather.app
          spctl -a -t exec -vv dist/Feather.app

      - name: Package app
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          # A disk image with an Applications shortcut so users can drag Feather into place.
          DMG="dist/Feather-${RELEASE_TAG#v}-${{ matrix.architecture }}.dmg"
          STAGING="$(mktemp -d)"
          cp -R dist/Feather.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname Feather -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          codesign --force --sign "$CODESIGN_IDENTITY" --timestamp "$DMG"
          xcrun notarytool submit "$DMG" --wait \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID"
          xcrun stapler staple "$DMG"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: Feather-${{ matrix.architecture }}
          path: dist/Feather-*-${{ matrix.architecture }}.dmg
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    # Sparkle's appcast tools are macOS binaries.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate signed appcasts
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_ED_KEY"
          swift package resolve
          bin=".build/artifacts/sparkle/Sparkle/bin"
          key="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" > "$key"
          for arch in arm64 x86_64; do
            dir="appcast/$arch"
            feed="release-assets/appcast-$arch.xml"
            mkdir -p "$dir"
            cp "release-assets/Feather-${RELEASE_TAG#v}-$arch.dmg" "$dir/"
            "$bin/generate_appcast" --ed-key-file "$key" \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
              --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
              -o "$feed" "$dir"
            # Installed apps require a signed feed (SURequireSignedFeed); sign it explicitly
            # and check that both the update and the feed carry signatures.
            "$bin/sign_update" --ed-key-file "$key" "$feed"
            grep -q "sparkle:edSignature" "$feed"
            grep -q "sparkle-signatures" "$feed"
          done
          rm "$key"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A full release (not a prerelease) is what /releases/latest resolves to: both the
          # website's download link and the update feeds installed apps read.
          assets="release-assets/*.dmg release-assets/appcast-*.xml"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" $assets --clobber
          else
            gh release create "$RELEASE_TAG" $assets \
              --title "Feather ${RELEASE_TAG#v}" \
              --notes "Download Feather-${RELEASE_TAG#v}-arm64.dmg for Apple silicon or Feather-${RELEASE_TAG#v}-x86_64.dmg for Intel, then drag Feather into Applications. Later versions install from Feather itself." \
              --generate-notes
          fi
