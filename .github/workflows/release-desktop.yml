name: Release desktop

# Builds the Windows app for the same `v*` tag as the macOS release and attaches them to
# that release. It never creates the release itself: `/releases/latest` must always carry the
# Sparkle appcasts, so the macOS workflow stays the only one that publishes it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    env:
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    defaults:
      run:
        shell: bash
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Set version from tag
        run: |
          version="${RELEASE_TAG#v}"
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          ' "$version"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build app
        env:
          # Signs the updater artifacts; installed apps verify them with the public key in
          # tauri.conf.json. Never replace this key, or installed apps reject every update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npx tauri build

      - name: Collect release assets
        run: |
          bundle="src-tauri/target/release/bundle"
          out="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$out"
          cp "$bundle"/nsis/*-setup.exe "$out/Feather-windows-x64-setup.exe"
          cp "$bundle"/nsis/*-setup.exe.sig "$out/Feather-windows-x64-setup.exe.sig"
          ls -l "$out"

      # Code signing by SignPath Foundation. Skipped until the SIGNPATH_API_TOKEN secret and the
      # SIGNPATH_ORGANIZATION_ID variable exist, so releases keep working unsigned before that.
      - name: Upload the unsigned installer
        id: unsigned
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Feather-windows-unsigned
          path: release-assets/Feather-windows-x64-setup.exe
          if-no-files-found: error

      - name: Sign the installer
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: feather
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Sign the signed installer for updates
        if: env.SIGNPATH_ENABLED == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Changing the installer invalidates the updater signature made during the build, and
          # installed apps would reject the update, so sign the final file again.
          out="$GITHUB_WORKSPACE/release-assets"
          cp "$GITHUB_WORKSPACE/signed/Feather-windows-x64-setup.exe" "$out/Feather-windows-x64-setup.exe"
          npx tauri signer sign "$out/Feather-windows-x64-setup.exe"
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: Feather-windows-x86_64
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Write the update feed
        run: |
          version="${RELEASE_TAG#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          jq -n \
            --arg version "$version" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
            --arg windowsSignature "$(cat release-assets/Feather-windows-x64-setup.exe.sig)" \
            --arg windowsUrl "$base/Feather-windows-x64-setup.exe" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "windows-x86_64": { signature: $windowsSignature, url: $windowsUrl }
              }
            }' > release-assets/latest-desktop.json
          cat release-assets/latest-desktop.json

      - name: Wait for the macOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 30
          done
          echo "The macOS workflow did not publish $RELEASE_TAG within an hour." >&2
          exit 1

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release-assets/Feather-windows-x64-setup.exe \
            release-assets/latest-desktop.json
