name: Desktop checks

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-checks.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-checks.yml"

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Check frontend
        working-directory: desktop
        run: npm run build

      - name: Check Rust backend
        working-directory: desktop
        run: cargo check --manifest-path src-tauri/Cargo.toml
