[package]
name = "feather-desktop"
version = "0.1.0"
description = "Feather's Windows and Linux prototype"
authors = ["Feather contributors"]
edition = "2021"

[lib]
name = "feather_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
